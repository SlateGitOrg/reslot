[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reslot"
version = "0.1.0"
description = "Warehouse re-slotting as an exact assignment under S-shape routing, scored on held-out orders."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "reslot contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pyyaml>=6",
]

[project.scripts]
reslot = "reslot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reslot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
